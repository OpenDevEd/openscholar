name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request run tests the merge result. When it passed, it records the
  # tree it tested. A push whose tree matches has nothing new to test.
  tested:
    name: Tested tree
    if: github.event_name == 'push'
    runs-on: openscholar-light
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - name: Look for a passed pull request run of this tree
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GITHUB_TOKEN"
          # Any lookup failure runs the full suite.
          tree="$(curl -fsS -H "$auth" "$api/git/commits/$GITHUB_SHA" | jq -r .tree.sha)" || tree=""
          count=0
          if [ -n "$tree" ]; then
            count="$(curl -fsS -H "$auth" "$api/actions/artifacts?name=ci-passed-$tree" \
              | jq '[.artifacts[] | select(.expired | not)] | length')" || count=0
          fi
          if [ "$count" -gt 0 ]; then
            echo "A pull request run already passed tree $tree."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  changes:
    name: Changes
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.passed != 'true' }}
    runs-on: openscholar-light
    timeout-minutes: 5
    outputs:
      runtime_required: ${{ steps.detect.outputs.runtime_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "runtime_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "Could not resolve the pull request base. Running runtime tests."
            echo "runtime_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files="$(git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA")"; then
            echo "Could not resolve changed files. Running runtime tests."
            echo "runtime_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runtime_required=false
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            case "$changed_file" in
              *.md|*.png|*.jpg|*.jpeg|*.webp|docs/*|plans/*|.agents/*|.claude/*|convex/_generated/*)
                ;;
              *)
                runtime_required=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "runtime_required=$runtime_required" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests
    runs-on: openscholar-light
    timeout-minutes: 20
    needs: changes
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-project

      - name: Check email source access
        id: email-source-access
        env:
          SOURCE_KEY: ${{ secrets.EVIDENCE_LIBRARY_SOURCE_KEY }}
        run: |
          if [ -n "$SOURCE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Shared email source verification needs repository secrets; unit tests will still run."
          else
            echo "::error::The shared email source key is missing."
            exit 1
          fi

      - name: Read the pinned email source revision
        if: steps.email-source-access.outputs.available == 'true'
        id: email-source
        run: echo "commit=$(node -p 'require("./lib/emails/source-lock.json").commit')" >> "$GITHUB_OUTPUT"

      - name: Check out the shared email source
        if: steps.email-source-access.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: OpenDevEd/new-el
          ref: ${{ steps.email-source.outputs.commit }}
          fetch-depth: 0
          ssh-key: ${{ secrets.EVIDENCE_LIBRARY_SOURCE_KEY }}
          path: .email-source
          sparse-checkout: |
            src/lib/emails/library-template.ts
            src/lib/escape-html.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the shared email source
        if: steps.email-source-access.outputs.available == 'true'
        run: npm run check:email-template -- .email-source

      - name: Remove the source checkout
        if: always()
        run: rm -rf .email-source

      - name: Check animation and transition clashes
        run: npm run check:animation-clash

      - name: Run unit and contract tests
        run: npm run test

  build:
    name: Build
    runs-on: openscholar-light
    timeout-minutes: 20
    needs: changes
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-project

      - name: Restore the Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.name }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'convex/**/*', 'i18n/**/*', 'lib/**/*', 'next.config.ts', 'package.json') }}
          restore-keys: |
            ${{ runner.name }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  e2e-auth:
    runs-on: openscholar-secret
    timeout-minutes: 30
    # Starts with the unit tests and the build instead of after them.
    needs: changes
    if: needs.changes.outputs.runtime_required == 'true'
    # One test backend: each run pushes its own Convex functions, so runs take turns.
    concurrency:
      group: e2e-auth-convex
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
      # Self-hosted test backend on the Hetzner Coolify (service openscholar-e2e).
      NEXT_PUBLIC_CONVEX_URL: https://convex-e2e.opendev.space
      NEXT_PUBLIC_CONVEX_SITE_URL: https://convex-e2e-site.opendev.space
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      E2E_CLERK_ORGANIZATION_ID: ${{ secrets.E2E_CLERK_ORGANIZATION_ID }}
      E2E_BASE_URL: http://localhost:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run build && npm run start -- --hostname localhost --port 3000
      NEXT_BUILD_SKIP_VERIFIED_TYPES: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Check auth test environment
        id: auth-environment
        run: |
          required_vars=(
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            NEXT_PUBLIC_CLERK_SIGN_IN_URL
            NEXT_PUBLIC_CLERK_SIGN_UP_URL
            NEXT_PUBLIC_CONVEX_URL
            CLERK_JWT_ISSUER_DOMAIN
            CLERK_WEBHOOK_SIGNING_SECRET
            E2E_CLERK_USER_EMAIL
            E2E_CLERK_USER_PASSWORD
          )
          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              missing_vars+=("$var_name")
            fi
          done
          if [ "${#missing_vars[@]}" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            printf '::error::Missing required auth secret/env: %s\n' "${missing_vars[*]}"
            exit 1
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          printf '::notice::Skipping auth E2E because this pull request has no auth test environment: %s\n' "${missing_vars[*]}"

      - if: steps.auth-environment.outputs.available == 'true'
        uses: ./.github/actions/setup-project

      - name: Install Playwright browser
        if: steps.auth-environment.outputs.available == 'true'
        run: npx playwright install chromium

      # The test runs this change's frontend, so the backend gets this change's functions.
      # The admin key is given to this step only, not to install, build or tests.
      - name: Push Convex functions to the test backend
        if: steps.auth-environment.outputs.available == 'true'
        env:
          CONVEX_SELF_HOSTED_URL: https://convex-e2e.opendev.space
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.E2E_CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: |
          if [ -z "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]; then
            echo "::error::E2E_CONVEX_SELF_HOSTED_ADMIN_KEY is not set"
            exit 1
          fi
          npx convex deploy --yes

      - name: Run auth and citation E2E
        if: steps.auth-environment.outputs.available == 'true'
        run: npx playwright test e2e/auth.spec.ts e2e/citations.spec.ts --config=playwright.config.ts

      - name: Upload Playwright report
        if: failure() && steps.auth-environment.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload app logs
        if: failure() && steps.auth-environment.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output
          path: test-results
          if-no-files-found: ignore

  billing-live:
    runs-on: openscholar-secret
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.runtime_required == 'true'
    concurrency:
      group: billing-live-shared-test-user
      cancel-in-progress: false
    env:
      PLAYWRIGHT_WORKERS: "8"
      NEXT_BUILD_SKIP_VERIFIED_TYPES: "1"
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      CONVEX_DEPLOYMENT_NAME: ${{ secrets.CONVEX_DEPLOYMENT_NAME }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_GO_PRICE_ID: ${{ secrets.STRIPE_GO_PRICE_ID }}
      STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
      CREDITS_PER_USD: ${{ secrets.CREDITS_PER_USD }}
      BILLING_TEST_USER_SUBJECT: billing_live_test_subject
      BILLING_TEST_USER_EMAIL: billing-live-test@example.com
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      E2E_CLERK_ORGANIZATION_ID: ${{ secrets.E2E_CLERK_ORGANIZATION_ID }}
      E2E_BASE_URL: http://localhost:3001
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run build && npm run start -- --hostname localhost --port 3001
    steps:
      - uses: actions/checkout@v6

      - name: Check billing test environment
        id: billing-environment
        run: |
          required_vars=(
            NEXT_PUBLIC_CONVEX_URL
            CONVEX_DEPLOY_KEY
            STRIPE_SECRET_KEY
            STRIPE_GO_PRICE_ID
            CLERK_SECRET_KEY
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            E2E_CLERK_USER_EMAIL
            E2E_CLERK_USER_PASSWORD
            E2E_CLERK_ORGANIZATION_ID
          )
          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              missing_vars+=("$var_name")
            fi
          done
          if [ -z "${CONVEX_DEPLOYMENT}" ] && [ -z "${CONVEX_DEPLOYMENT_NAME}" ]; then
            missing_vars+=("CONVEX_DEPLOYMENT or CONVEX_DEPLOYMENT_NAME")
          fi
          if [ "${#missing_vars[@]}" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            printf '::error::Missing required billing secret/env: %s\n' "${missing_vars[*]}"
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '::notice::Skipping live billing checks because this pull request has no billing test environment: %s\n' "${missing_vars[*]}"
          fi
          if [ "${#missing_vars[@]}" -eq 0 ] && [ "$NEXT_PUBLIC_CREDITS_ENABLED" = "false" ]; then
            echo "::error::NEXT_PUBLIC_CREDITS_ENABLED is set to 'false' — credit cap banner tests (CRED-05) will fail"
            exit 1
          fi

      - if: steps.billing-environment.outputs.available == 'true'
        uses: ./.github/actions/setup-project

      - name: Install Playwright browser
        if: steps.billing-environment.outputs.available == 'true'
        run: npx playwright install chromium

      - name: Run required live and browser billing checks
        if: steps.billing-environment.outputs.available == 'true'
        run: |
          BILLING_LIVE_PUSH_CONVEX=true npm run test:billing:preflight -- --push-convex

          set +e

          npm run test:billing:live &
          live_pid=$!
          npm run test:billing:e2e &
          browser_pid=$!

          wait "$live_pid"
          live_status=$?
          wait "$browser_pid"
          browser_status=$?

          if (( live_status != 0 || browser_status != 0 )); then
            printf '::error::Billing checks failed: live=%s browser=%s\n' "$live_status" "$browser_status"
            exit 1
          fi

      - name: Upload billing-live artifacts
        if: failure() && steps.billing-environment.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: billing-live-artifacts
          path: test-results/billing-live
          if-no-files-found: ignore

      - name: Upload billing E2E report
        if: failure() && steps.billing-environment.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: billing-e2e-report-${{ github.job }}
          path: playwright-report
          if-no-files-found: ignore

  billing-live-extended:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: openscholar-secret
    timeout-minutes: 60
    needs: billing-live
    continue-on-error: true
    concurrency:
      group: billing-live-shared-test-user
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      CONVEX_DEPLOYMENT_NAME: ${{ secrets.CONVEX_DEPLOYMENT_NAME }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_GO_PRICE_ID: ${{ secrets.STRIPE_GO_PRICE_ID }}
      STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
      CREDITS_PER_USD: ${{ secrets.CREDITS_PER_USD }}
      BILLING_TEST_USER_SUBJECT: billing_live_test_subject
      BILLING_TEST_USER_EMAIL: billing-live-test@example.com
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      E2E_CLERK_ORGANIZATION_ID: ${{ secrets.E2E_CLERK_ORGANIZATION_ID }}
      E2E_BASE_URL: http://localhost:3001
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run build && npm run start -- --hostname localhost --port 3001
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-project

      - name: Validate billing environment
        run: |
          if [ "$NEXT_PUBLIC_CREDITS_ENABLED" = "false" ]; then
            echo "::error::NEXT_PUBLIC_CREDITS_ENABLED is set to 'false' — credit cap banner tests (CRED-05) will fail"
            exit 1
          fi

      - name: Run extended live billing regressions (non-blocking)
        run: npm run test:billing:extended:ci

      - name: Upload billing-live-extended artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: billing-live-extended-artifacts
          path: test-results/billing-live
          if-no-files-found: ignore

  ci:
    name: CI
    runs-on: openscholar-light
    timeout-minutes: 5
    if: always()
    needs:
      - tested
      - changes
      - unit-tests
      - build
      - e2e-auth
      - billing-live
    steps:
      - name: Require every selected CI lane to pass
        env:
          TESTED: ${{ needs.tested.outputs.passed }}
          CHANGES: ${{ needs.changes.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime_required }}
          AUTH: ${{ needs.e2e-auth.result }}
          BILLING: ${{ needs.billing-live.result }}
        run: |
          if [ "$TESTED" = true ]; then
            echo "A pull request run already passed this tree."
            exit 0
          fi
          test "$CHANGES" = success
          test "$UNIT_TESTS" = success
          test "$BUILD" = success
          if test "$RUNTIME_REQUIRED" = true; then
            test "$AUTH" = success
            test "$BILLING" = success
          else
            test "$AUTH" = skipped
            test "$BILLING" = skipped
          fi

      - name: Name the tested tree
        id: tree
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" | jq -r .tree.sha)"
          echo "$tree" > "$RUNNER_TEMP/tested-tree"
          echo "sha=$tree" >> "$GITHUB_OUTPUT"

      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ci-passed-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 14
